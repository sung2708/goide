name: Security Audit

on:
  schedule:
    - cron: "0 0 * * 1" # Weekly on Monday
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - "package-lock.json"
      - "src-tauri/Cargo.lock"
      - "tools/update-verifier/Cargo.lock"
      - ".github/workflows/security.yml"
      - "deny.toml"
  pull_request:
    paths:
      - "package-lock.json"
      - "src-tauri/Cargo.lock"
      - "tools/update-verifier/Cargo.lock"
      - ".github/workflows/security.yml"
      - "deny.toml"

permissions:
  contents: read

jobs:
  audit-npm:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: "npm"

      - name: Run npm audit
        run: npm audit --audit-level=low

  audit-rust:
    name: Rust Advisory, Licence and Source Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install the pinned auditor
        run: cargo install cargo-deny --locked --version 0.20.2 --jobs 2
      - name: Audit application dependencies
        run: cargo deny --manifest-path src-tauri/Cargo.toml check advisories licenses sources
      - name: Audit release signature verifier dependencies
        run: cargo deny --manifest-path tools/update-verifier/Cargo.toml check advisories licenses sources
