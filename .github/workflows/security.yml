name: Security Audit

on:
  schedule:
    - cron: "0 0 * * 1" # Weekly on Monday
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - "package-lock.json"
      - "src-tauri/Cargo.lock"
      - "tools/update-verifier/Cargo.lock"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "package-lock.json"
      - "src-tauri/Cargo.lock"
      - "tools/update-verifier/Cargo.lock"
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  audit-npm:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: "npm"

      - name: Run npm audit
        run: npm audit --audit-level=low

  audit-rust:
    name: Rust Advisory Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install the pinned auditor
        run: cargo install cargo-audit --locked --version 0.22.2 --jobs 2
      - name: Audit application dependencies
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Audit release signature verifier dependencies
        run: cargo audit --file tools/update-verifier/Cargo.lock
