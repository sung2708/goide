name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Candidate tag matching the canonical app version"
        required: true
        type: string
      publish:
        description: "Publish verified assets to the configured public distribution repository"
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read
concurrency:
  group: goro-release-distribution
  cancel-in-progress: false
env:
  GORO_UPDATER_PUBLIC_KEY: ${{ vars.GORO_UPDATER_PUBLIC_KEY }}
  GORO_SIGNING_PUBLIC_KEY: ${{ vars.GORO_SIGNING_PUBLIC_KEY || vars.GORO_UPDATER_PUBLIC_KEY }}
  GORO_RELEASE_BASE_URL: ${{ vars.GORO_RELEASE_BASE_URL }}
  GORO_RELEASE_REPOSITORY: ${{ vars.GORO_RELEASE_REPOSITORY || github.repository }}

jobs:
  validate-and-plan:
    name: Validate Tag & Prepare Notes
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse_tag.outputs.tag }}
      version: ${{ steps.parse_tag.outputs.version }}
      is_prerelease: ${{ steps.parse_tag.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require a maintainer-controlled release ref
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/validate-release-ref.mjs

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify public update configuration before platform builds
        run: node scripts/validate-update-config.mjs --public-only

      - name: Verify Windows installer version conversion
        run: node --test scripts/windows-installer-version.node-test.mjs

      - name: Parse tag and validate version synchronization
        id: parse_tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="$RELEASE_TAG"
          echo "Tag: $TAG"
          
          # Use the shared canonical SemVer/channel policy, including beta/RC.
          node --input-type=module -e 'import { releaseChannel } from "./scripts/release-contract.mjs"; const tag = process.env.RELEASE_TAG; if (!tag?.startsWith("v")) throw new Error("Release tag must start with v"); releaseChannel(tag.slice(1));'

          # Validate version matches package.json, tauri.conf.json, and Cargo.toml
          node scripts/version-manager.mjs check --tag "$TAG"

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Release Notes
        env:
          RELEASE_TAG: ${{ steps.parse_tag.outputs.tag }}
        run: |
          if [[ -f "docs/releases/$RELEASE_TAG.md" ]]; then
            cp "docs/releases/$RELEASE_TAG.md" release-notes.md
          else
            node scripts/generate-changelog.mjs --tag "$RELEASE_TAG" --output release-notes.md
          fi

      - name: Upload Release Notes artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

  build-artifacts:
    environment: release-signing
    name: Build (${{ matrix.platform.platform_id }}-${{ matrix.platform.arch_id }})
    needs: validate-and-plan
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: true
      matrix:
        platform:
          - os: windows-latest
            platform_id: windows
            arch_id: x86_64
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            platform_id: macos
            arch_id: aarch64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform_id: macos
            arch_id: x86_64
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            platform_id: linux
            arch_id: x86_64
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable audited 2026-10-04
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install npm dependencies
        run: npm ci
      - name: Require secure distribution configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node scripts/validate-update-config.mjs
      - name: Generate public Tauri updater build configuration
        run: node scripts/update-build-config.mjs
      - name: Verify versions and documentation
        run: |
          npm run version:check
          npm run docs:check
          node --test scripts/*.node-test.mjs

      - name: Run verification tests
        run: npm test

      - name: Run Rust tests
        if: runner.os != 'Windows'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Run Rust tests (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\cargo_test_msvc.cmd --locked -- --test-threads=1

      - name: Build Tauri Application
        if: runner.os != 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --target ${{ matrix.platform.target }} --config .tmp/goro-updater-build.json --ci

      - name: Build Tauri Application (MSVC)
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: cmd
        run: scripts\tauri_build_msvc.cmd --target ${{ matrix.platform.target }} --config .tmp/goro-updater-build.json --ci

      - name: Package and normalize release artifacts
        shell: bash
        run: |
          node scripts/package-artifacts.mjs \
            --tag "${{ needs.validate-and-plan.outputs.tag }}" \
            --platform "${{ matrix.platform.platform_id }}" \
            --arch "${{ matrix.platform.arch_id }}" \
            --bundle-dir "src-tauri/target/${{ matrix.platform.target }}/release/bundle" \
            --output-dir "dist-release"

      - name: Upload platform artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-${{ matrix.platform.platform_id }}-${{ matrix.platform.arch_id }}
          path: dist-release/*
          retention-days: 2

  publish:
    permissions:
      contents: write
    environment: release-distribution
    name: Verify Release Metadata and Optional Public Distribution
    needs: [validate-and-plan, build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install metadata dependencies
        run: npm ci
      - name: Setup Rust signature verifier
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable audited 2026-10-04
      - name: Build signature verifier
        run: cargo build --locked --release --manifest-path tools/update-verifier/Cargo.toml

      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes
          path: .

      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: artifacts-*
          path: release-assets
          merge-multiple: true

      - name: Generate both metadata contracts from verified signed artifacts
        run: |
          node scripts/release-metadata.mjs \
            --tag "${{ needs.validate-and-plan.outputs.tag }}" \
            --repository "$GORO_RELEASE_REPOSITORY" \
            --assets-dir release-assets --output-dir release-metadata \
            --notes release-notes.md \
            --verifier tools/update-verifier/target/release/goro-update-verifier \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Validate all release assets before publishing
        run: |
          node scripts/validate-release-assets.mjs \
            --tag "${{ needs.validate-and-plan.outputs.tag }}" \
            --assets-dir release-assets
          node scripts/validate-release-metadata.mjs \
            --tag "${{ needs.validate-and-plan.outputs.tag }}" \
            --repository "$GORO_RELEASE_REPOSITORY" \
            --assets-dir release-assets --metadata-dir release-metadata

      - name: Upload verified candidate contracts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-contracts
          path: release-metadata/*
      - name: Publish to public distribution repository with metadata last
        if: github.event_name == 'push' || inputs.publish
        env:
          GORO_RELEASE_TOKEN: ${{ secrets.GORO_RELEASE_TOKEN || github.token }}
        run: node scripts/publish-release.mjs --assets-dir release-assets --metadata-dir release-metadata --notes release-notes.md

  deploy-metadata:
    name: Deploy verified update metadata to Pages
    needs: publish
    if: (github.event_name == 'push' || inputs.publish) && (vars.GORO_RELEASE_REPOSITORY == '' || vars.GORO_RELEASE_REPOSITORY == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published metadata only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload metadata site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
      - name: Deploy metadata site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
