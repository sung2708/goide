name: CI

on:
  push:
    branches:
      - main
      - develop
      - "codex/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  release-contracts:
    name: Release Contract Verification (No Release Secrets)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Setup Rust verifier toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install fixture dependencies
        run: npm ci
      - name: Build official signature verifier
        run: cargo build --locked --release --manifest-path tools/update-verifier/Cargo.toml
      - name: Test metadata, publication and endpoint contracts locally
        run: node --test scripts/*.node-test.mjs
      - name: Validate release workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes= .github/workflows/release.yml

  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate version synchronization
        run: node scripts/version-manager.mjs check

      - name: Verify Windows installer version conversion
        run: node --test scripts/windows-installer-version.node-test.mjs

      - name: Validate documentation links
        run: npm run docs:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Build frontend production bundle
        run: npm run build

  rust-checks:
    name: Rust Backend Verification (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux x64
            arch: x64
          - os: windows-latest
            platform: Windows x64
            arch: x64
          - os: macos-15
            platform: macOS ARM64
            arch: arm64
          - os: macos-15-intel
            platform: macOS Intel x64
            arch: x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify native runner architecture
        run: node -e "if(process.arch !== '${{ matrix.arch }}') throw new Error('Unexpected runner architecture ' + process.arch); console.log(process.platform, process.arch)"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Cargo clippy check
        if: runner.os != 'Windows'
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Cargo clippy check (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\cargo_clippy_msvc.cmd --locked --all-targets

      - name: Cargo check
        if: runner.os != 'Windows'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Cargo check (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\cargo_check_msvc.cmd --locked

      - name: Cargo test
        if: runner.os != 'Windows'
        # Native fixtures represent one app and share its process/tool registries.
        # Their explicit concurrency tests still exercise real overlapping requests.
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Cargo test (MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\cargo_test_msvc.cmd --locked -- --test-threads=1

  e2e:
    name: End-to-end (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    # Linux is the verified baseline. Windows and macOS use the same embedded
    # WebDriver provider but stay non-blocking until they have passed in CI.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux x64
            experimental: false
          - os: windows-latest
            platform: Windows x64
            experimental: true
          - os: macos-15
            platform: macOS ARM64
            experimental: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix e2e

      - name: Build the e2e test binary (debug, --features e2e)
        if: runner.os != 'Windows'
        run: npm run e2e:build

      - name: Build the e2e test binary (debug, --features e2e, MSVC)
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\init_msvc.cmd && npm run e2e:build

      - name: Run end-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e

      - name: Run end-to-end tests
        if: runner.os != 'Linux'
        run: npm run e2e
