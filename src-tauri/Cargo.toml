[package]
name = "goide"
version = "0.5.0-alpha.2"
description = "A desktop IDE for Go editing, runtime inspection, and concurrency workflows"
authors = ["sung2708"]
license = "MIT"
repository = "https://github.com/sung2708/goide"
homepage = "https://github.com/sung2708/goide"
keywords = ["go", "ide", "tauri", "debugger", "concurrency"]
edition = "2021"
rust-version = "1.88"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "goide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["native-tls", "zip"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
semver = "1"
url = "2"
sha2 = "0.11"
zip = { version = "4.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = { version = "0.8.1", path = "vendor/portable-pty" }
uuid = { version = "1", features = ["v4"] }
notify = "8.2"
regex = "1"
ignore = "0.4"
globset = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
